[project]
name = "groq-chromadb-rag"
version = "1.0.0"
description = "Groq and ChromaDB RAG application"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "groq>=0.30",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30"
]

[tool.vercel]
entrypoint = "api:app"